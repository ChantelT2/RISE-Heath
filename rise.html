<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rise">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf1f6">
<title>Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fdf1f6;
    --card: #ffffff;
    --pink: #e8628f;
    --pink-soft: #f7d3e0;
    --pink-dark: #c94770;
    --lilac: #b98ee0;
    --lilac-soft: #ece0f9;
    --gold: #dba956;
    --text: #4a2438;
    --text-dim: #a9829a;
    --line: #f5d9e6;
    --warn: #e2795f;
    --shadow: 0 4px 16px rgba(201,71,112,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Quicksand', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 980px; margin: 0 auto; padding: 0 18px 90px; }

  header.top{
    position: relative;
    padding: 30px 4px 22px;
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap: wrap; gap: 10px;
  }
  .brand{
    font-family:'Playfair Display', serif; font-style: italic; font-weight:600;
    font-size: 34px; color: var(--pink-dark); letter-spacing: 0.2px;
  }
  .brand .dot{ color: var(--lilac); font-style: normal; }
  .subtag{ font-family:'Quicksand', sans-serif; font-weight:600; font-size: 12px; color: var(--text-dim); letter-spacing: 0.4px; text-transform: uppercase; }
  .scallop{
    height: 16px; width: 100%; margin-bottom: 18px;
    background: radial-gradient(circle at 12px 0, transparent 10px, var(--pink-soft) 11px) repeat-x;
    background-size: 24px 16px;
    background-position: top;
  }

  nav.tabs{ display:flex; gap: 8px; margin-bottom: 20px; }
  nav.tabs button{
    flex:1; background: var(--card); border: 1.5px solid var(--line); color: var(--text-dim);
    font-family: 'Quicksand', sans-serif; font-weight:600; text-transform: uppercase; letter-spacing: 0.6px; font-size: 13px;
    padding: 12px; cursor:pointer; border-radius: 999px; transition: all .15s ease;
  }
  nav.tabs button.active{ background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: var(--shadow); }
  nav.tabs button:hover:not(.active){ border-color: var(--pink); color: var(--pink-dark); }

  nav.subtabs{ display:flex; gap: 6px; margin-bottom: 16px; }
  nav.subtabs button{
    background: none; border: 1.5px dashed var(--line); color: var(--text-dim);
    font-family:'Quicksand', sans-serif; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.4px;
    padding: 7px 12px; border-radius: 999px; cursor:pointer;
  }
  nav.subtabs button.active{ background: var(--lilac-soft); border-color: var(--lilac); color: var(--pink-dark); border-style: solid; }

  section.tabpane, .subpane{ display:none; }
  section.tabpane.active, .subpane.active{ display:block; }

  .card{ background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .row{ display:flex; gap: 14px; flex-wrap: wrap; }
  .row > .card{ flex:1; min-width: 240px; }

  label.mini{
    font-family:'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase;
    color: var(--text-dim); display:block; margin-bottom: 4px; letter-spacing: 0.5px;
  }
  input, select, textarea{
    width:100%; background: #fffdfe; border: 1.5px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 11px; font-family: 'Quicksand', sans-serif; font-weight:500; font-size: 13.5px; margin-bottom: 8px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color: var(--pink); }
  ::placeholder{ color: #d9b8c8; }

  button.btn{
    background: var(--lilac-soft); border: 1.5px solid var(--lilac); color: var(--pink-dark);
    border-radius: 999px; padding: 9px 14px; cursor:pointer;
    font-family:'Quicksand', sans-serif; font-weight:700; text-transform: uppercase; font-size: 12px; letter-spacing: 0.4px;
  }
  button.btn:hover{ background: var(--lilac); color: #fff; }
  button.btn.solid{ background: var(--pink); color: #fff; border: none; }
  button.btn.solid:hover{ background: var(--pink-dark); }
  button.btn.danger{ border-color: var(--warn); color: var(--warn); background: none; }

  h3.sec-title{
    font-family:'Playfair Display', serif; font-style: italic; font-weight:600;
    font-size: 18px; margin: 0 0 10px; color: var(--pink-dark);
  }

  /* Heart toggle — signature control used across the app */
  .heart{
    width: 26px; height: 26px; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    color: var(--line); transition: all .15s ease;
  }
  .heart::before{ content:'♥'; }
  .heart.on{ color: var(--pink); transform: scale(1.12); }
  .heart.big{ width:36px; height:36px; font-size:22px; }

  /* ---------- Nutrition ---------- */
  .macro-rings{ display:flex; gap: 16px; flex-wrap:wrap; justify-content: space-around; }
  .ring-item{ text-align:center; min-width: 70px; }
  .ring-num{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 18px; color: var(--pink-dark); }
  .ring-label{ font-family:'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
  .bar-track{ width: 64px; height: 6px; background: var(--pink-soft); border-radius: 3px; margin: 6px auto 0; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--pink); }
  .bar-fill.over{ background: var(--warn); }

  .meal-block{ margin-bottom: 16px; }
  .meal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; }
  .meal-name{ font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:15px; color: var(--lilac); }
  .food-row{
    display:grid; grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 0.8fr 0.8fr auto auto;
    gap: 6px; align-items:center; margin-bottom: 6px; font-size: 12.5px;
  }
  .food-row input{ margin-bottom:0; padding: 6px 8px; font-size:12.5px; }
  .food-head{
    display:grid; grid-template-columns: 2fr 0.8fr 0.8fr 0.8fr 0.8fr 0.8fr auto auto;
    gap: 6px; font-family:'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom: 6px;
  }
  .icon-btn{
    background:none; border:1.5px solid var(--line); border-radius:8px; width:26px; height:26px;
    cursor:pointer; color: var(--text-dim); font-size:13px; line-height:1;
  }
  .icon-btn:hover{ border-color: var(--pink); color: var(--pink-dark); }
  .icon-btn.del{ color: var(--warn); }
  .icon-btn.del:hover{ border-color: var(--warn); }

  .micro-panel{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(105px,1fr)); gap: 8px;
    background: var(--lilac-soft); border-radius:10px; padding: 10px; margin-top: 4px; margin-bottom: 8px;
  }
  .micro-item .ml{ color: var(--text-dim); text-transform:uppercase; font-family:'JetBrains Mono', monospace; font-size:9px; display:block; }

  .chip{
    display:inline-flex; align-items:center; gap:6px; background: var(--pink-soft); border:1.5px solid var(--pink-soft);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor:pointer; margin: 0 6px 6px 0; font-weight:600;
  }
  .chip:hover{ border-color: var(--pink); }
  .chip small{ color: var(--pink-dark); font-family:'JetBrains Mono', monospace; }

  .net-carb-tag{ color: var(--lilac); }

  /* ---------- Workouts: weekly plan ---------- */
  .weeknav{ display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono', monospace; font-size: 12px; color: var(--text-dim); }
  .weeknav button{
    background: none; border: 1.5px solid var(--line); color: var(--text); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; font-family: inherit;
  }
  .weeknav button:hover{ border-color: var(--pink); color: var(--pink-dark); }

  .plan-bar{ display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .plan-bar p{ font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin: 0; }

  .petals{ display:flex; align-items:flex-end; gap: 8px; height: 44px; margin: 4px 0 20px; }
  .petal{
    width: 30px; border-radius: 14px 14px 4px 4px; background: var(--pink-soft);
    display:flex; align-items:flex-start; justify-content:center; padding-top:4px;
    font-size: 11px; color: var(--text-dim); transition: all .2s ease;
  }
  .petal.filled{ background: var(--pink); color:#fff; font-weight:700; }

  .day-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .day-card{ background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
  .day-card.done{ border-color: var(--pink); }
  .day-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; }
  .day-name{ font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size: 15px; color: var(--pink-dark); }
  .day-date{ font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); }
  .equip-tag{
    display:inline-block; font-family:'JetBrains Mono', monospace; font-size: 9.5px; color: var(--lilac);
    border: 1.5px solid var(--lilac-soft); border-radius: 999px; padding: 2px 9px; margin-bottom: 8px;
  }
  details.exlist{ margin-top: 8px; }
  details.exlist summary{
    cursor:pointer; font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--pink-dark);
    text-transform: uppercase; letter-spacing: 0.5px; list-style: none;
  }
  details.exlist summary::-webkit-details-marker{ display:none; }
  details.exlist summary::before{ content: '✦ '; }
  .ex-item{
    display:flex; justify-content:space-between; gap: 8px; font-size: 12px; padding: 5px 0;
    border-bottom: 1px dashed var(--line); color: var(--text-dim);
  }
  .ex-item:last-child{ border-bottom:none; }
  .ex-item .ex-name{ color: var(--text); }
  .ex-item .ex-reps{ font-family:'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; color: var(--pink-dark); }

  /* ---------- Workouts: log ---------- */
  .ex-card{ background: var(--lilac-soft); border-radius:14px; padding:12px; margin-bottom: 10px; }
  .ex-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .ex-card-name{ font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:15px; color: var(--pink-dark); }
  .set-row{ display:grid; grid-template-columns: 34px 1fr 1fr 34px 30px; gap:6px; align-items:center; margin-bottom:6px; }
  .set-row input{ margin-bottom:0; padding:6px 7px; font-size:13px; text-align:center; }
  .set-idx{ font-family:'JetBrains Mono', monospace; color: var(--text-dim); font-size:12px; text-align:center; }
  .set-head{
    display:grid; grid-template-columns: 34px 1fr 1fr 34px 30px; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:9px; color: var(--text-dim);
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px;
  }

  .session-summary{
    display:flex; justify-content:space-between; align-items:center; padding: 10px 14px;
    background: var(--pink-soft); border-radius:12px; margin-bottom:8px; cursor:pointer;
  }
  .session-summary:hover{ box-shadow: var(--shadow); }
  .session-title{ font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:14px; color: var(--pink-dark); }
  .session-meta{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color: var(--text-dim); }

  .pr-table{ width:100%; border-collapse: collapse; font-size:12.5px; }
  .pr-table th{ text-align:left; font-family:'JetBrains Mono', monospace; font-size:9px; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; padding: 4px 6px; border-bottom: 1.5px solid var(--line); }
  .pr-table td{ padding: 6px; border-bottom: 1px dashed var(--line); }

  /* ---------- Habits ---------- */
  .habit-card{ display:flex; align-items:center; gap: 14px; padding: 14px 16px; }
  .habit-body{ flex:1; min-width: 0; }
  .habit-name{ font-family:'Playfair Display', serif; font-style:italic; font-weight:600; font-size:16px; color: var(--pink-dark); }
  .habit-streak{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color: var(--gold); margin-top:2px; }
  .heatmap{ display:grid; grid-template-columns: repeat(14, 1fr); gap: 3px; margin-top: 8px; max-width: 300px; }
  .heat-cell{ aspect-ratio: 1; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); }
  .color-pick{ display:flex; gap:6px; margin-bottom:8px; align-items:center; }
  .color-swatch{ width:22px; height:22px; border-radius:50%; cursor:pointer; border: 2px solid transparent; }
  .color-swatch.sel{ border-color: var(--text); }

  .save-note{ font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); text-align:center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">rise<span class="dot">.</span></div>
      <div class="subtag">Nourish · Move · Build habits</div>
    </div>
  </header>
  <div class="scallop"></div>

  <nav class="tabs">
    <button id="tabNutBtn" class="active">Nutrition</button>
    <button id="tabWorkBtn">Workouts</button>
    <button id="tabHabitBtn">Habits</button>
  </nav>

  <!-- ============ NUTRITION ============ -->
  <section id="tabNut" class="tabpane active">
    <div class="row">
      <div class="card" style="flex:0 0 190px;">
        <label class="mini">Date</label>
        <input type="date" id="nutDate">
        <label class="mini">Daily targets</label>
        <input type="number" id="tgProtein" placeholder="Protein g">
        <input type="number" id="tgCarbs" placeholder="Carbs g">
        <input type="number" id="tgFat" placeholder="Fat g">
        <input type="number" id="tgKcal" placeholder="Kcal">
      </div>
      <div class="card macro-rings" id="ringsCard" style="flex:1;"></div>
    </div>

    <div class="card" id="mealsCard"></div>

    <div class="card">
      <h3 class="sec-title">Saved foods</h3>
      <div id="savedFoodsChips"></div>
      <button class="btn" id="newSavedFoodBtn">＋ Save a new food</button>
    </div>
  </section>

  <!-- ============ WORKOUTS ============ -->
  <section id="tabWork" class="tabpane">
    <nav class="subtabs">
      <button id="subPlanBtn" class="active">Weekly Plan</button>
      <button id="subLogBtn">Log a Session</button>
      <button id="subHistBtn">History &amp; PRs</button>
    </nav>

    <div id="subPlan" class="subpane active">
      <div class="plan-bar">
        <p>Senada / WeRise 7-Day Home Workout Guide</p>
        <div style="display:flex; gap:10px; align-items:center;">
          <div class="weeknav">
            <button id="prevWeek">‹ prev</button>
            <span id="weekLabel">—</span>
            <button id="nextWeek">next ›</button>
          </div>
          <button class="btn solid" id="loadPlanBtn">Load plan into this week</button>
        </div>
      </div>
      <div class="petals" id="petalStack"></div>
      <div class="day-grid" id="dayGrid"></div>
    </div>

    <div id="subLog" class="subpane">
      <div class="row">
        <div class="card" style="flex:0 0 190px;">
          <label class="mini">Session date</label>
          <input type="date" id="workDate">
          <label class="mini">Session name</label>
          <input type="text" id="workName" placeholder="e.g. Push day">
        </div>
        <div class="card" style="flex:1;">
          <h3 class="sec-title">Add exercise</h3>
          <div style="display:flex; gap:8px;">
            <input type="text" id="exercisePicker" placeholder="Type exercise name" style="margin-bottom:0;">
            <button class="btn solid" id="addExerciseBtn" style="white-space:nowrap;">Add</button>
          </div>
        </div>
      </div>
      <div id="exerciseCards"></div>
    </div>

    <div id="subHist" class="subpane">
      <div class="card">
        <h3 class="sec-title">Session history</h3>
        <div id="historyList"></div>
      </div>
      <div class="card">
        <h3 class="sec-title">Personal records</h3>
        <select id="prExercisePicker" style="max-width:280px;"></select>
        <table class="pr-table" id="prTable"></table>
      </div>
    </div>
  </section>

  <!-- ============ HABITS ============ -->
  <section id="tabHabit" class="tabpane">
    <div class="card">
      <h3 class="sec-title">Add a habit</h3>
      <div style="display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap;">
        <input type="text" id="newHabitName" placeholder="Habit name (e.g. Drink 2L water)" style="flex:1; min-width:200px; margin-bottom:0;">
        <div class="color-pick" id="habitColorPick"></div>
        <button class="btn solid" id="addHabitBtn">Add habit</button>
      </div>
    </div>
    <div id="habitList"></div>
  </section>

  <div class="save-note">All entries save automatically to this phone's browser — works fully offline.</div>
</div>

<script>
/* ============================================================
   Shared helpers
============================================================ */
function fmt(d){ return d.toISOString().slice(0,10); }
// Uses the phone browser's own localStorage, so this file works fully offline
// and standalone once saved — no connection to Claude needed after that.
async function sGet(key){
  try{ const raw = localStorage.getItem('rise:' + key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
async function sSet(key, value){
  try{ localStorage.setItem('rise:' + key, JSON.stringify(value)); }
  catch(e){ console.error('storage set failed', e); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============================================================
   Top-level Tabs
============================================================ */
const tabs = {
  nut: {btn:'tabNutBtn', pane:'tabNut'},
  work: {btn:'tabWorkBtn', pane:'tabWork'},
  habit: {btn:'tabHabitBtn', pane:'tabHabit'},
};
function switchTab(name){
  Object.keys(tabs).forEach(k => {
    document.getElementById(tabs[k].btn).classList.toggle('active', k===name);
    document.getElementById(tabs[k].pane).classList.toggle('active', k===name);
  });
}
document.getElementById('tabNutBtn').onclick = () => switchTab('nut');
document.getElementById('tabWorkBtn').onclick = () => switchTab('work');
document.getElementById('tabHabitBtn').onclick = () => switchTab('habit');

/* Workouts sub-tabs */
const subtabs = { plan:{btn:'subPlanBtn', pane:'subPlan'}, log:{btn:'subLogBtn', pane:'subLog'}, hist:{btn:'subHistBtn', pane:'subHist'} };
function switchSubtab(name){
  Object.keys(subtabs).forEach(k => {
    document.getElementById(subtabs[k].btn).classList.toggle('active', k===name);
    document.getElementById(subtabs[k].pane).classList.toggle('active', k===name);
  });
  if(name==='hist'){ renderHistory(); renderPRPicker(); }
}
document.getElementById('subPlanBtn').onclick = () => switchSubtab('plan');
document.getElementById('subLogBtn').onclick = () => switchSubtab('log');
document.getElementById('subHistBtn').onclick = () => switchSubtab('hist');

/* ============================================================
   NUTRITION
============================================================ */
const MEALS = ['Breakfast','Lunch','Dinner','Snacks'];
const MICRO_FIELDS = [
  ['sugar','Sugar','g'], ['sodium','Sodium','mg'],
  ['potassium','Potassium','mg'], ['calcium','Calcium','mg'], ['iron','Iron','mg'], ['vitaminC','Vit C','mg']
];
function blankFood(){
  return { name:'', protein:'', carbs:'', fat:'', kcal:'', fiber:'', sugar:'', sodium:'', potassium:'', calcium:'', iron:'', vitaminC:'' };
}
function nutKey(dateStr){ return 'nutrition:day:' + dateStr; }
const TARGETS_KEY = 'nutrition:targets';
const SAVEDFOODS_KEY = 'nutrition:savedFoods';

async function loadNutritionDay(dateStr){
  let day = await sGet(nutKey(dateStr));
  if(!day){ day = { meals: { Breakfast:[], Lunch:[], Dinner:[], Snacks:[] } }; }
  let targets = await sGet(TARGETS_KEY);
  if(!targets){ targets = { protein:'', carbs:'', fat:'', kcal:'' }; }
  document.getElementById('tgProtein').value = targets.protein;
  document.getElementById('tgCarbs').value = targets.carbs;
  document.getElementById('tgFat').value = targets.fat;
  document.getElementById('tgKcal').value = targets.kcal;

  renderMeals(dateStr, day);
  renderRings(day, targets);
  renderSavedFoods(dateStr, day);
}

function dayTotals(day){
  const tot = {protein:0,carbs:0,fat:0,kcal:0,fiber:0};
  Object.values(day.meals).forEach(list => list.forEach(f => {
    tot.protein += Number(f.protein)||0;
    tot.carbs += Number(f.carbs)||0;
    tot.fat += Number(f.fat)||0;
    tot.kcal += Number(f.kcal)||0;
    tot.fiber += Number(f.fiber)||0;
  }));
  return tot;
}

function renderRings(day, targets){
  const tot = dayTotals(day);
  const netCarbs = Math.max(0, Math.round((tot.carbs - tot.fiber)*10)/10);
  const card = document.getElementById('ringsCard');
  card.innerHTML = '';
  const items = [
    {label:'Protein', val: Math.round(tot.protein), target: Number(targets.protein)||0, unit:'g'},
    {label:'Carbs', val: Math.round(tot.carbs), target: Number(targets.carbs)||0, unit:'g'},
    {label:'Fat', val: Math.round(tot.fat), target: Number(targets.fat)||0, unit:'g'},
    {label:'Kcal', val: Math.round(tot.kcal), target: Number(targets.kcal)||0, unit:''},
  ];
  items.forEach(it => {
    const pct = it.target > 0 ? Math.min(150, Math.round((it.val/it.target)*100)) : 0;
    const wrap = document.createElement('div');
    wrap.className = 'ring-item';
    wrap.innerHTML = `
      <div class="ring-num">${it.val}${it.unit}</div>

function getMonday(d){
  const date = new Date(d);
  const day = (date.getDay() + 6) % 7;
  date.setDate(date.getDate() - day);
  date.setHours(0,0,0,0);
  return date;
}
function currentWeekMonday(){
  const base = new Date();
  base.setDate(base.getDate() + weekOffset * 7);
  return getMonday(base);
}
function weekKey(monday){ return 'calendar-week:' + fmt(monday); }

const SESSIONS_KEY = 'workouts:sessions';

async function loadWorkoutsForDate(dateStr){

async function persistCurrentSession(){
  const sessions = await sGet(SESSIONS_KEY) || [];
  const idx = sessions.findIndex(s => s.id === currentSession.id);
  if(idx >= 0) sessions[idx] = currentSession;
  else sessions.push(currentSession);
  await sSet(SESSIONS_KEY, sessions);
}

async function renderPRTable(name){
  const table = document.getElementById('prTable');
  table.innerHTML = '';
  if(!name) return;
  const sessions = await sGet(SESSIONS_KEY) || [];
  const rows = [];
  sessions.forEach(s => {
    s.exercises.filter(e => e.name === name).forEach(ex => {
      let bestWeight = 0, bestReps = 0, volume = 0;
      ex.sets.forEach(st => {
        const w = Number(st.weight)||0, r = Number(st.reps)||0;
        volume += w*r;
        if(w > bestWeight){ bestWeight = w; bestReps = r; }
      });
      rows.push({ date: s.date, bestWeight, bestReps, volume });
    });
  });
  rows.sort((a,b) => a.date.localeCompare(b.date));
  table.innerHTML = `<tr><th>Date</th><th>Best set</th><th>Volume</th></tr>` +
    rows.map(r => `<tr><td>${r.date}</td><td>${r.bestWeight}kg × ${r.bestReps}</td><td>${Math.round(r.volume)}kg</td></tr>`).join('');
  if(!rows.length) table.innerHTML += `<tr><td colspan="3" style="color:var(--text-dim);">No logged sets yet for this exercise.</td></tr>`;
}

function dateRangeBack(n){
  const arr = [];
  const today = new Date();
  for(let i=n-1;i>=0;i--){ const d = new Date(today); d.setDate(d.getDate()-i); arr.push(fmt(d)); }
  return arr;
}

function computeStreaks(data, habitId){
  const today = new Date();
  let current = 0;
  for(let i=0;i<3650;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const ds = fmt(d);
    if(data.completions[ds] && data.completions[ds][habitId]) current++;
    else break;
  }
  let longest = 0, run = 0, prevDate = null;
  Object.keys(data.completions).sort().forEach(ds => {
    if(data.completions[ds][habitId]){
      if(prevDate){ const diff = (new Date(ds) - new Date(prevDate)) / 86400000; run = diff === 1 ? run+1 : 1; }
      else run = 1;
      longest = Math.max(longest, run);
      prevDate = ds;
    }
  });
  return { current, longest: Math.max(longest, current) };
}

function renderHabits(data){
  const wrap = document.getElementById('habitList');
  wrap.innerHTML = '';
  if(!data.habits.length){
    wrap.innerHTML = '<p style="color:var(--text-dim); font-size:13px;">No habits yet — add your first one above.</p>';
    return;
  }
  const today = fmt(new Date());
  const days = dateRangeBack(28);

  data.habits.forEach(h => {
    const card = document.createElement('div');
    card.className = 'card habit-card';

    const checkedToday = !!(data.completions[today] && data.completions[today][h.id]);
    const heart = document.createElement('div');
    heart.className = 'heart big' + (checkedToday ? ' on' : '');
    heart.style.color = checkedToday ? `var(${h.color})` : '';
    heart.onclick = async () => {
      if(!data.completions[today]) data.completions[today] = {};
      data.completions[today][h.id] = !data.completions[today][h.id];
      if(!data.completions[today][h.id]) delete data.completions[today][h.id];
      await sSet(HABITS_KEY, data);
      renderHabits(data);
    };

    const body = document.createElement('div');
    body.className = 'habit-body';
    const streaks = computeStreaks(data, h.id);
    body.innerHTML = `<div class="habit-name">${h.name}</div>
      <div class="habit-streak">✦ ${streaks.current} day streak · best ${streaks.longest}</div>`;

    const heat = document.createElement('div');
    heat.className = 'heatmap';
    days.forEach(ds => {
      const cell = document.createElement('div');
      cell.className = 'heat-cell';
      cell.title = ds;
      if(data.completions[ds] && data.completions[ds][h.id]){
        cell.style.background = `var(${h.color})`;
        cell.style.borderColor = `var(${h.color})`;
      }
      heat.appendChild(cell);
    });
    body.appendChild(heat);

    const del = document.createElement('button');
    del.className = 'icon-btn del';
    del.textContent = '×';
    del.onclick = async () => { data.habits = data.habits.filter(x => x.id !== h.id); await sSet(HABITS_KEY, data); renderHabits(data); };

    card.appendChild(heart);
    card.appendChild(body);
    card.appendChild(del);
    wrap.appendChild(card);
  });
}

document.getElementById('addHabitBtn').onclick = async () => {
  const nameInput = document.getElementById('newHabitName');
  const name = nameInput.value.trim();
  if(!name) return;
  let data = await sGet(HABITS_KEY) || { habits: [], completions: {} };
  data.habits.push({ id: uid(), name, color: pickedColor });
  await sSet(HABITS_KEY, data);
  nameInput.value = '';
  renderHabits(data);
};

============================================================ */
(async function init(){
  const today = fmt(new Date());
  document.getElementById('nutDate').value = today;
  document.getElementById('workDate').value = today;
  await loadNutritionDay(today);
  await loadWeek();
  await loadWorkoutsForDate(today);
  await renderHistory();
  await renderPRPicker();
  await loadHabits();
})();
</script>
